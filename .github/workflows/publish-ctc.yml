name: Publish verified CTC packages
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ctc-packages-v1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install conversion tools
        run: |
          python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.57.1 onnx==1.19.1 onnxruntime==1.23.2 soundfile==0.13.1 jsonschema==4.25.1
      - name: Convert, verify and generate catalog
        run: python ctc-models/tools/publish_packages.py
      - name: Publish immutable packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ctc-v1 packages/* --target "$GITHUB_SHA" --title 'Vex CTC models v1' --notes-file ctc-models/docs/RELEASE_NOTES.md
      - name: Publish catalog only after assets exist
        run: |
          cp packages/catalog.json ctc-models/catalog.json
          python ctc-models/tools/check_catalog.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ctc-models/catalog.json
          git commit -m 'Publish verified CTC model catalog'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ctc-validation
          path: packages/validation.json
